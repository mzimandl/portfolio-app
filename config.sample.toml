# Copy to config.toml and adjust.

# Path to the SQLite database. A relative path is relative to this file.
db = "portfolio.db"

# Currency everything is reported in (ISO 4217 code).
base_currency = "CZK"

# Locale used for number and currency formatting.
locale = "cs"

# Optional: instrument types shown apart from the investments, with their own totals.
# They are left out of the headline numbers and of the default view of returns and charts.
separate_types = ["savings"]

# Optional: automatic backups. A copy of the database is made before the first use on every
# day the data changed. Default: a "backups" folder next to the database, the last 30 kept.
# backup_dir = "backups"
# backup_keep = 30        # 0 switches them off

# Optional: the rules the Taxes page applies. Shown are the defaults.
# tax_holding_years = 3          # a sale of units held longer than this is exempt
# tax_proceeds_limit = 100000    # all sales of a year are exempt up to these proceeds
# tax_crypto_types = ["crypto"]  # types for which the limit is counted apart

# Optional: Yahoo symbol to compare portfolio performance against.
# benchmark = "VWCE.DE"
