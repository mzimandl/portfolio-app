# Copy to config.toml and adjust.

# Path to the SQLite database. A relative path is relative to this file.
db = "portfolio.db"

# Currency everything is reported in (ISO 4217 code).
base_currency = "CZK"

# Locale used for number and currency formatting.
locale = "cs"

# Optional: instrument types shown apart from the investments, with their own totals.
# They are left out of the headline numbers and of the default view of returns and charts.
separate_types = ["savings"]

# Optional: Yahoo symbol to compare portfolio performance against.
# benchmark = "VWCE.DE"
